<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>真夏の爆音！トロンボーン祭 in 名古屋</title>
<style>
/* ============================================
   マイナーズ30周年記念 特設サイト
   --------------------------------------------
   Illustratorで制作したデザインを
   スライス画像として書き出し、
   HTMLへ縦に配置する構成です。

   デザイン基準幅：750pt
   書き出し画像：1500px（@2x）

   ※画像本体は編集せず、
     CSS・JavaScriptのみで
     サイト全体のデザインや動きを調整します。
============================================ */
  /* ============================================
   CSS Index

   1. 基本設定
   2. ページ本体
   3. YouTubeエリア
   4. スマートフォン表示
   5. MENUボタン
   6. オーバーレイ
   7. ドロワーメニュー
   8. ページトップボタン
============================================ */
  /* ============================================
   基本設定
============================================ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html{scroll-behavior:smooth;}
  html,
body {
  margin: 0;
  padding: 0;
  background: #0b0b0b url("images/background-brand.png") center center fixed no-repeat;
  background-size: cover;
}
/* ============================================
   ページ本体
   Illustratorから書き出した
   全スライス画像をまとめる領域

   ・PC最大1000px
   ・スマホでは画面いっぱい
   ・中央配置
============================================ */
.page {
  width: 95%;
  max-width: 1000px;
  margin: 40px auto;
  background: #fff;

/* Illustratorから書き出した画像同士に
   隙間が発生しないようにする */
  font-size: 0;
  line-height: 0;

  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 20px 80px rgba(0,0,0,.45);
}
/* 各スライス画像

   display:block
      → img特有の余白を除去

   width:100%
      → ページ幅いっぱいに表示

   height:auto
      → 縦横比を保持
*/
  .page img {
    display: block;
    width: 100%;
    height: auto;
  }
/* スライス画像全体を
   ボタンとしてクリック可能にする */
  .page a {
    display: block;
  }
/* ============================================
   YouTube動画エリア

   Illustratorでは3枚の画像として
   書き出しているため、
   CSSで横一列に並べて表示する。
============================================ */
  .yt-row {
    display: flex;
  }
  .yt-row a {
    /* 3分割スライス(各500px/1500px = 1/3) */
    flex: 1 1 33.3333%;
    min-width: 0;
  }
  .yt-row a img {
    width: 100%;
  }
  /* ============================================
   スマートフォン表示

   ・ページ幅100%
   ・角丸なし
   ・影なし
   ・ボタン位置調整
============================================ */
@media (max-width:768px){

.page{

width:100%;
max-width:750px;

margin:0 auto;

border-radius:0;

box-shadow:none;

}

.menu-btn{

right:18px;

top:18px;

}
.to-top{

right:18px;

bottom:18px;

width:48px;

height:48px;

font-size:20px;

}

}
  /* ============================================
   MENUボタン

   画面右上に固定表示
   ガラス風デザイン
============================================ */
.menu-btn{
position:fixed;
top:20px;
right:calc((100vw - min(1000px,95vw))/2 + 20px);

width:78px;
height:46px;

border:none;
border-radius:24px;

background:rgba(28,28,28,.35);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

color:#e4c56c;

font:700 14px/46px "Helvetica Neue",sans-serif;
letter-spacing:.12em;
text-align:center;

cursor:pointer;

transition:.25s;

box-shadow:
0 10px 30px rgba(0,0,0,.35);

z-index:10000;
}
  .menu-btn:hover{

transform:translateY(-2px);

background:rgba(45,45,45,.55);

box-shadow:
0 14px 36px rgba(0,0,0,.45);

}
.menu-btn.hide{

    opacity:0;

    transform:translateY(-10px);

    pointer-events:none;

}
  /* ============================================
   オーバーレイ

   ドロワーメニュー表示時に
   背景を暗くするレイヤー
============================================ */
.overlay{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.45);

    opacity:0;
    visibility:hidden;

    transition:.25s;

    z-index:9998;

}

.overlay.open{

    opacity:1;
    visibility:visible;

}
  /* ============================================
   スライドメニュー

   MENUボタンから表示される
   右側ドロワーメニュー
============================================ */
.drawer{
position:fixed;
top:0;
right:-340px;

width:220px;
max-width:65%;

height:100%;

padding:70px 20px;

background:rgba(18,18,18,.62);

backdrop-filter:blur(26px);
-webkit-backdrop-filter:blur(26px);

border-left:
1px solid rgba(255,255,255,.08);

color:#fff;

transition:.35s;

overflow:auto;

z-index:9999;
}
.drawer.open{right:0}
.drawer h2{

font:700 28px "Helvetica Neue",sans-serif;

letter-spacing:.18em;

text-align:center;

margin-bottom:36px;

color:#e4c56c;

}
.drawer a{

display:block;

padding:13px 10px;

text-decoration:none;

color:white;

font:14px "Helvetica Neue",sans-serif;

letter-spacing:.06em;

border-bottom:
1px solid rgba(255,255,255,.08);

transition:.25s;

}
  .drawer a:hover{

padding-left:24px;

color:#e4c56c;

}
   /* ============================================
   SNSエリア
============================================ */

.drawer-sns{

margin-top:30px;
padding-top:24px;

border-top:
1px solid rgba(255,255,255,.08);

text-align:center;

}

.drawer-sns p{

font:12px "Helvetica Neue",sans-serif;
letter-spacing:.18em;

color:rgba(255,255,255,.55);

margin-bottom:18px;

}

.drawer-sns a{

display:inline-flex;

align-items:center;
justify-content:center;

width:48px;
height:48px;

margin:0 8px;

border:none;

border-radius:50%;

background:rgba(255,255,255,.08);

color:#e4c56c;

font-size:24px;

text-decoration:none;

transition:.25s;

}

.drawer-sns a:hover{

background:rgba(255,255,255,.16);

transform:translateY(-2px);

}
  /* ============================================
   ページトップへ戻るボタン

   スクロール時のみ表示
============================================ */
.to-top{
    position:fixed;

    right:24px;
    bottom:24px;

    width:56px;
    height:56px;

    display:flex;
    flex-direction:column;   /* ←追加 */
    align-items:center;
    justify-content:center;

    border-radius:50%;

    text-decoration:none;

    background:rgba(28,28,28,.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    color:#e4c56c;
    font-size:20px;          /* 少し小さくする */
    font-weight:bold;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    opacity:0;
    transition:
        opacity .25s,
        transform .25s,
        background .25s;

    z-index:9997;
}
.to-top span{

    font-size:9px;
    letter-spacing:.08em;

    margin-top:-3px;

}
.to-top.show{
    opacity:1;
}

.to-top:hover{
    transform:translateY(-3px);
    background:rgba(45,45,45,.55);
}
.to-top .arrow{
    font-size:20px;
    line-height:1;
}

.to-top .label{
    font-size:12px;      /* 9px→12px */
    letter-spacing:.08em;
    line-height:1;
    margin-top:-2px;
}
/* ============================================
   9 Comment Button
   マイナーズへの一言メッセージボタン
============================================ */

.comment-btn{

    position:fixed;

    left:24px;
    bottom:24px;

    width:56px;
    height:56px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(28,28,28,.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    color:#e4c56c;

    text-decoration:none;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    transition:
        transform .25s,
        background .25s;

    z-index:9997;

}

.comment-btn:hover{

    background:rgba(28,28,28,.55);

    transform:translateY(-3px);

}

.comment-btn .icon{

    font-size:20px;
    line-height:1;

}

.comment-btn .label{

    font-size:11px;
    line-height:1;

    margin-top:-2px;

}
/* ============================================
   Comment Window
   コメント入力ウィンドウ
============================================ */

.comment-overlay{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.45);

    opacity:0;
    visibility:hidden;

    transition:.25s;

    z-index:9998;

}

.comment-window{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-45%);

    width:320px;
    max-width:88%;

    padding:30px;

    border-radius:20px;

    background:rgba(25,25,25,.72);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 18px 60px rgba(0,0,0,.45);

    color:white;

    text-align:center;

    opacity:0;
    visibility:hidden;

    transition:.25s;

    z-index:9999;
}

.comment-window.show{

    opacity:1;
    visibility:visible;

    transform:
        translate(-50%,-50%);

}

.comment-overlay.show{

    opacity:1;
    visibility:visible;

}

.comment-window h3{

    color:#e4c56c;

    margin-bottom:16px;

}
.comment-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;

}

.comment-header h3{

    margin:0;

    color:#e4c56c;

}
.comment-window p{

    line-height:1.8;

    margin-bottom:24px;

}

.comment-link{

    display:inline-block;

    padding:12px 28px;

    border-radius:999px;

    background:#e4c56c;

    color:#222;

    font-weight:bold;

    text-decoration:none;

}

.comment-link:hover{

    opacity:.9;

}

.comment-close{

    position:absolute;

    top:12px;
    right:12px;

    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:50%;

    background:transparent;

    color:rgba(255,255,255,.75);

    font-size:24px;
    line-height:1;

    cursor:pointer;

    transition:
        background .25s,
        color .25s,
        transform .25s;

}

.comment-close:hover{

    background:rgba(255,255,255,.10);

    color:white;

    transform:rotate(90deg);

}
/*==============================
Movie Popup
==============================*/

.movie-overlay{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);

    opacity:0;
    visibility:hidden;

    transition:.35s;

    z-index:99990;

}

.movie-overlay.show{

    opacity:1;
    visibility:visible;

}

.movie-window{

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-45%) scale(.95);

    width:520px;
    max-width:90%;

    padding:30px;

    border-radius:22px;

    background:rgba(20,20,20,.90);

    backdrop-filter:blur(18px);

    color:white;

    text-align:center;

    opacity:0;
    visibility:hidden;

    transition:.35s;

    z-index:99991;

}

.movie-window.show{

    opacity:1;

    visibility:visible;

    transform:translate(-50%,-50%) scale(1);

}

.movie-window h2{

    font-size:42px;

    margin-bottom:12px;

}

.movie-sub{

    margin:18px 0 24px;

    color:#e4c56c;

    font-size:20px;

    font-weight:bold;

}

.movie-close{

    position:absolute;

    top:15px;

    right:15px;

    border:none;

    background:none;

    color:white;

    font-size:28px;

    cursor:pointer;

}

.movie-later{

    margin-top:20px;

    border:none;

    background:none;

    color:#bbb;

    cursor:pointer;

}

.movie-later:hover{

    color:white;

}
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn">MENU</button>
<div class="overlay" id="overlay"></div>
<nav class="drawer" id="drawer">
<h2>MENU</h2>
<a href="#">トップ</a>
<a href="https://teket.jp/14274/67030">チケット</a>
<a href="#robby">ロビーイベント</a>
<a href="#ending">終演後企画</a>
<a href="#members">出演者</a>
<a href="#Explan">楽曲解説</a>
<a href="#joybrass">出展情報</a>
<a href="#history">歴史</a>
<a href="https://www.youtube.com/@minors_channel">動画</a>
   <div class="drawer-sns"></div>
</nav>

<div class="page">
<img src="20260814img/slice_1.png" alt="concert image">
<img src="20260814img/slice_2.png" alt="concert image">
<img src="20260814img/slice_3.png" alt="concert image">
<img src="20260814img/slice_4.png" alt="concert image">
<img src="20260814img/slice_5.png" alt="concert image">
<img src="20260814img/slice_6.png" alt="concert image">
<img src="20260814img/slice_7.png" alt="concert image">
<img src="20260814img/slice_8.png" alt="concert image">
<img src="20260814img/slice_9.png" alt="concert image">
 <img src="20260814img/slice_10.png" alt="concert image">
</div>
<script>
const b=document.getElementById('menuBtn'),d=document.getElementById('drawer'),o=document.getElementById('overlay');
function c(){d.classList.remove('open');o.classList.remove('open')}
b.onclick=()=>{d.classList.toggle('open');o.classList.toggle('open')};
o.onclick=c;
document.querySelectorAll('.drawer a').forEach(a=>a.onclick=c);
/* 初期状態ではMENUを隠す */
b.classList.add("hide");

/* 少しスクロールしたら表示 */
addEventListener("scroll",()=>{

    b.classList.toggle("hide",scrollY<20);

});
</script>
</body></html>
